# The shared GTM policy file. The planner renders goal/patterns/thresholds into
# its prompt, the orchestrator reads guardrails, and the revops agents render icp,
# thresholds, and negative_signals into their own prompts -- so a policy number
# lives here once, not once per prompt.
#
# Never parsed into a graph or state machine -- that would make it the fixed
# sequence the design rules forbid. Thresholds reach the models as prompt context,
# not as branch logic in code.

goal: >
  Given a raw inbound lead, determine whether it fits our ICP and, if so, get a
  personalized first-touch draft in front of the right rep.

success_criteria:
  - lead is enriched with firmographics
  - a fit score with written reasons exists
  - qualified leads have an assigned rep and a drafted first touch
  - disqualified leads terminate early with the reason recorded

# Prose, because it is dropped into the scoring prompt verbatim.
icp: >
  B2B software and services companies, 50-5000 employees, North America or
  Western Europe, with an identifiable buying signal.

patterns:
  - name: standard_qualification
    when: a new raw lead with no enrichment
    guidance: >
      Enrich first -- scoring without firmographics produces noise. Score against
      ICP, then route on the score band, then draft outreach for the assigned rep.

  - name: pre_enriched_lead
    when: the lead already carries firmographics
    guidance: >
      Skip enrichment and score directly. Re-enriching costs money and adds nothing.

  - name: early_disqualification
    when: score is below the disqualify threshold, or negative signals are present
    guidance: >
      Terminate after scoring. Do not route and do not draft outreach -- a rep
      should never receive a lead we have already judged unqualified.

thresholds:
  route_to_sales: 80
  nurture: 60
  disqualify: 40

negative_signals:
  - free_email_domain
  - competitor
  - out_of_region
  - under_10_employees

guardrails:
  max_steps: 12
  budget_usd: 0.50
