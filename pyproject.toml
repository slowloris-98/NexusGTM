[project]
name = "nexusgtm"
version = "0.1.0"
description = "Agent control plane for coordinating GTM departments"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.3",
    "langgraph>=1.0",
    "openai>=1.60",
    "langsmith>=0.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pyyaml>=6.0",
    "jsonschema>=4.23",
    "python-dotenv>=1.0",
    # Runtime now, not just tests: the RevOps department calls Clay and HubSpot.
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["core*", "store*", "departments*", "api*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
