<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>NexusGTM Control Plane</title>
    <!-- The stored theme, applied before first paint. Without this a reader who chose
         dark gets a white frame while the module graph loads and React mounts. Blocking
         and inline on purpose: an external or deferred script paints first and defeats
         the point. The key matches src/theme.ts; light needs no attribute because it is
         what the stylesheet already is. -->
    <script>
      try {
        if (localStorage.getItem("nexusgtm-theme") === "dark")
          document.documentElement.dataset.theme = "dark";
      } catch (e) {
        /* storage blocked; light is the correct fallback anyway */
      }
    </script>
  </head>
  <body>
    <!--
      THESIS: One screen answers the standing daily question. It refuses the tabbed
      dashboard whose tabs mirror the data model rather than anyone's job.
      OWN-WORLD: The Instrument Panel. Warm-neutral chassis (#f9f9f7 rail, #fcfcfb pane),
      1px alpha hairlines, system stack, one Signal Blue that marks selection and nothing
      else, four reserved status hues that only ever mean state.
      STORY: A GTM lead sees pipeline health, what broke, and what it cost in twenty
      seconds without clicking; then opens one row to read why the planner chose what it did.
      FIRST VIEWPORT: Fixed 340px rail left — filter, pinned Today and Spend, In flight,
      Recent. Pane right opens on the Today briefing: health line, exceptions or an explicit
      all-clear, spend band. No primary action; the read is the task.
      FORM: The Split Console, 7 of 7 grounded structures ordered by resonance; seed 3d223551.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
